{% extends "admin/dashboard.html" %}
{% block content %}
   <div class='w-1/2 mx-auto my-8'>
    <ul>
        {% for message in messages %}
           <li class='bg-green-600 text-white px-1 py-2'>{{message}}</li>
        {% endfor %}
    </ul>
    <form method="POST">
        {% csrf_token %}
        {{form}}
        <button class='bg-blue-600 p-2 rounded text-white font-bold mt-2' type="submit">Assign Role</button>
    </form>
   </div>
{% endblock content %}
